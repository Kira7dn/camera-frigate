syntax = "proto3";

package camera.tracker.v1;

service TrackerService {
  rpc Connect(stream MainEnvelope) returns (stream EdgeEnvelope);
  rpc Configure(ConfigureRequest) returns (ConfigureResponse);
  rpc GetCapabilities(CapabilitiesRequest) returns (CapabilitiesResponse);
  rpc GetEvidence(EvidenceRequest) returns (EvidenceResponse);
  rpc StreamMedia(MediaRequest) returns (stream MediaChunk);
  rpc ControlCamera(ControlRequest) returns (ControlResponse);
}

enum TrackerOperation {
  TRACKER_OPERATION_UNSPECIFIED = 0;
  TRACKER_OPERATION_START = 1;
  TRACKER_OPERATION_UPDATE = 2;
  TRACKER_OPERATION_END = 3;
}

enum ControlOperation {
  CONTROL_OPERATION_UNSPECIFIED = 0;
  CONTROL_OPERATION_ENABLE = 1;
  CONTROL_OPERATION_DISABLE = 2;
  CONTROL_OPERATION_MANUAL_PTZ = 3;
  CONTROL_OPERATION_PRESET = 4;
  CONTROL_OPERATION_CALIBRATE = 5;
  CONTROL_OPERATION_TOPOLOGY_DRAIN = 6;
  CONTROL_OPERATION_MEDIA_DELETE = 7;
  CONTROL_OPERATION_MEDIA_RETAIN = 8;
}

message BBox {
  int32 left = 1;
  int32 top = 2;
  int32 right = 3;
  int32 bottom = 4;
}

message EvidenceReference {
  string evidence_id = 1;
  uint64 byte_length = 2;
  string sha256 = 3;
  int64 expiry_unix_ms = 4;
  bool durable = 5;
}

message LifecycleFailure {
  string code = 1;
  string detail = 2;
  bool retryable = 3;
  bool gap = 4;
}

message MediaManifest {
  string media_id = 1;
  string event_id = 2;
  string camera_id = 3;
  double start_time = 4;
  double end_time = 5;
  string codec = 6;
  uint64 byte_size = 7;
  string sha256 = 8;
  int64 expiry_unix_ms = 9;
  string media_type = 10;
}

message TrackerUpdate {
  string node_id = 1;
  string node_epoch = 2;
  string camera_id = 3;
  string stream_epoch = 4;
  uint64 journal_sequence = 5;
  uint64 frame_seq = 6;
  int64 source_pts = 7;
  double frame_time = 8;
  string event_id = 9;
  string track_id = 10;
  TrackerOperation operation = 11;
  string label = 12;
  repeated double score_history = 13;
  double score = 14;
  BBox bbox = 15;
  string attributes_json = 16;
  repeated string current_zones = 17;
  repeated string entered_zones = 18;
  string path_json = 19;
  optional double speed = 20;
  string motion_json = 21;
  string region_json = 22;
  optional EvidenceReference evidence = 23;
  optional LifecycleFailure failure = 24;
  repeated MediaManifest media = 25;
  string state_json = 26;
}

message ClientHello {
  string client_id = 1;
  string schema_version = 2;
  uint64 replay_after_sequence = 3;
}

message JournalAck {
  string node_id = 1;
  string node_epoch = 2;
  uint64 journal_sequence = 3;
  string event_id = 4;
}

message HealthRequest {}

message MainEnvelope {
  oneof request {
    ClientHello hello = 1;
    JournalAck ack = 2;
    HealthRequest health = 3;
  }
}

message EdgeHello {
  string node_id = 1;
  string node_epoch = 2;
  string schema_version = 3;
  string config_hash = 4;
}

message NodeHealth {
  string node_id = 1;
  string node_epoch = 2;
  bool ready = 3;
  bool degraded = 4;
  uint64 pending_ack = 5;
  uint64 spool_bytes = 6;
  uint64 pinned_evidence = 7;
  string detail = 8;
  uint64 active_lifecycles = 9;
}

message EdgeEnvelope {
  oneof response {
    EdgeHello hello = 1;
    TrackerUpdate update = 2;
    NodeHealth health = 3;
    LifecycleFailure failure = 4;
  }
}

message ConfigureRequest {
  string client_id = 1;
  string config_json = 2;
  string config_hash = 3;
}

message ConfigureResponse {
  string node_id = 1;
  string node_epoch = 2;
  string config_hash = 3;
}

message CapabilitiesRequest {}

message CapabilitiesResponse {
  string schema_version = 1;
  string node_id = 2;
  string node_epoch = 3;
  repeated string detector_runtimes = 4;
  uint64 max_evidence_bytes_per_camera = 5;
  uint64 max_media_chunk_bytes = 6;
  bool mtls_required = 7;
  bool ptz_supported = 8;
  repeated CameraHealth cameras = 9;
  NodeHealth health = 10;
  string config_hash = 11;
}

message CameraHealth {
  string camera_id = 1;
  bool ready = 2;
  double camera_fps = 3;
  double process_fps = 4;
  int32 capture_pid = 5;
  int32 process_pid = 6;
}

message EvidenceRequest {
  string evidence_id = 1;
}

message EvidenceResponse {
  string evidence_id = 1;
  bytes data = 2;
  repeated uint32 shape = 3;
  string layout = 4;
  string sha256 = 5;
  int64 expiry_unix_ms = 6;
}

message MediaRequest {
  string media_id = 1;
  uint64 offset = 2;
  optional uint64 length = 3;
}

message MediaChunk {
  string media_id = 1;
  uint64 offset = 2;
  bytes data = 3;
  bool eof = 4;
}

message ControlRequest {
  string command_id = 1;
  string camera_id = 2;
  ControlOperation operation = 3;
  string payload_json = 4;
  string expected_node_epoch = 5;
}

message ControlResponse {
  string command_id = 1;
  bool accepted = 2;
  string reason = 3;
  string node_epoch = 4;
  optional string config_patch_json = 5;
}
